[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medpmc-multi-panel-figure-detection"
version = "0.2.1"
description = "Multi-panel Figure Detection stage of the MedPMC data curation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yale-BIDS-Chen-Lab"}]
dependencies = [
  "boto3>=1.34",
  "Pillow>=10.3",
  "pyarrow>=15.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
inference = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "huggingface-hub>=0.23"
]
dev = ["pytest>=8.0"]

[project.scripts]
medpmc-multi-panel-figure-detection = "medpmc_multi_panel_figure_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
