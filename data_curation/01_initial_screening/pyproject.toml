[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medpmc-initial-screening"
version = "0.3.0"
description = "Initial Screening stage of the MedPMC data curation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yale-BIDS-Chen-Lab"}
]
dependencies = [
  "boto3>=1.34",
  "lxml>=5.2",
  "pyarrow>=15.0",
  "requests>=2.31",
  "tqdm>=4.66"
]

[project.optional-dependencies]
inference = [
  "torch>=2.2",
  "transformers>=4.44",
  "safetensors>=0.4"
]
dev = [
  "pytest>=8.0"
]

[project.scripts]
medpmc-initial-screening = "medpmc_initial_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
